name: ScipionWeb tests

on:
  push:
    branches:
      - devel
      - wizard-dialogs-refactor
  pull_request:
  workflow_dispatch:

jobs:
  detect-tests:
    runs-on: ubuntu-latest
    outputs:
      hasFrontendTests: ${{ steps.detect.outputs.hasFrontendTests }}
      hasBackendTests: ${{ steps.detect.outputs.hasBackendTests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect available test suites
        id: detect
        shell: bash
        run: |
          if [ -f package.json ] && [ -f vitest.config.ts ]; then
            echo "hasFrontendTests=true" >> "$GITHUB_OUTPUT"
          else
            echo "hasFrontendTests=false" >> "$GITHUB_OUTPUT"
          fi

          if find . -type f \( -name "test_*.py" -o -name "*_test.py" \) ! -path "*/node_modules/*" | grep -q .; then
            echo "hasBackendTests=true" >> "$GITHUB_OUTPUT"
          else
            echo "hasBackendTests=false" >> "$GITHUB_OUTPUT"
          fi

  frontend-tests:
    name: Frontend tests
    needs: detect-tests
    if: needs.detect-tests.outputs.hasFrontendTests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

  backend-tests:
    name: Backend tests
    needs: detect-tests
    if: needs.detect-tests.outputs.hasBackendTests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip

      - name: Install backend dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

          while IFS= read -r requirementsFile; do
            echo "Installing dependencies from ${requirementsFile}"
            python -m pip install -r "${requirementsFile}"
          done < <(find . -maxdepth 3 -type f \( -name "requirements-test.txt" -o -name "requirements-dev.txt" -o -name "requirements.txt" \) ! -path "*/node_modules/*" | sort)

          pyprojectDir="$(find . -maxdepth 3 -type f -name "pyproject.toml" ! -path "*/node_modules/*" -exec dirname {} \; | head -n 1)"
          if [ -n "${pyprojectDir}" ]; then
            echo "Installing package from ${pyprojectDir}"
            python -m pip install -e "${pyprojectDir}" || python -m pip install "${pyprojectDir}"
          fi

      - name: Run backend tests
        run: pytest
